name: CI Code Quality Check

on:
  pull_request:
    branches: [ "main", "staging" ]

jobs:
  check-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v3
        
      - name: Setup Node.js untuk Next.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Simulasi pengecekan kode Frontend
        run: echo "Menjalankan ESLint untuk Next.js... Aman!"

  check-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v3
        
      - name: Setup PHP untuk Laravel
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          
      - name: Simulasi pengecekan kode Backend
        run: echo "Menjalankan PHP CodeSniffer... Aman!"